<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- CSP：只允許自家腳本；連線只到 Gemini；圖片／影片可用使用者貼的 https 連結與本機 blob；內嵌播放器只准 YouTube nocookie 與 Vimeo -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: data: https:; connect-src 'self' https://generativelanguage.googleapis.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自動繪本">
<title>自動繪本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon2-180.png">
<link rel="icon" href="icons/icon2-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="pages">
    <section id="page-story" class="page active"></section>
    <section id="page-game" class="page"></section>
    <section id="page-repeat" class="page"></section>
    <section id="page-words" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-page="story">
      <span class="tab-icon">📖</span><span class="tab-label" data-i18n="tab_story">故事</span>
    </button>
    <button class="tab" data-page="game">
      <span class="tab-icon">🎈</span><span class="tab-label" data-i18n="tab_game">遊戲</span>
    </button>
    <button class="tab" data-page="repeat">
      <span class="tab-icon">🎤</span><span class="tab-label" data-i18n="tab_repeat">跟讀</span>
    </button>
    <button class="tab" data-page="words">
      <span class="tab-icon">🗂️</span><span class="tab-label" data-i18n="tab_words">字表</span>
    </button>
    <button class="tab" data-page="settings">
      <span class="tab-icon">⚙️</span><span class="tab-label" data-i18n="tab_settings">設定</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <canvas id="confetti-canvas"></canvas>

  <script src="js/rescue.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
