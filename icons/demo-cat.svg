<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 示範故事《小貓看星星》的內建插圖：夜空、月亮、山、小貓坐在水邊看水裡的星星 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A5C"/>
      <stop offset="0.7" stop-color="#3B4F9A"/>
      <stop offset="1" stop-color="#6E7FC4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4A8E"/>
      <stop offset="1" stop-color="#1B2A5C"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0,-9 L2.4,-3 L9,-2.6 L4,1.6 L5.6,8.4 L0,4.8 L-5.6,8.4 L-4,1.6 L-9,-2.6 L-2.4,-3 Z" fill="#FFE27A"/>
    </symbol>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- 月亮 -->
  <circle cx="640" cy="120" r="120" fill="url(#moonglow)"/>
  <circle cx="640" cy="120" r="52" fill="#FFF0B3"/>
  <circle cx="662" cy="108" r="44" fill="#3B4F9A" opacity="0.0"/>
  <circle cx="622" cy="128" r="9" fill="#F4DC8E"/>
  <circle cx="652" cy="100" r="6" fill="#F4DC8E"/>
  <circle cx="655" cy="140" r="5" fill="#F4DC8E"/>
  <!-- 星星 -->
  <use href="#star" x="80" y="70" width="28" height="28"/>
  <use href="#star" x="180" y="140" width="18" height="18"/>
  <use href="#star" x="300" y="60" width="22" height="22"/>
  <use href="#star" x="420" y="150" width="16" height="16"/>
  <use href="#star" x="500" y="50" width="26" height="26"/>
  <use href="#star" x="140" y="230" width="14" height="14"/>
  <use href="#star" x="360" y="230" width="20" height="20"/>
  <use href="#star" x="740" y="230" width="18" height="18"/>
  <use href="#star" x="250" y="170" width="12" height="12"/>
  <use href="#star" x="580" y="210" width="14" height="14"/>
  <!-- 遠山 -->
  <path d="M0,360 C120,260 220,280 320,330 C400,370 470,300 560,320 C650,340 720,290 800,330 L800,420 L0,420 Z" fill="#26386F"/>
  <path d="M0,400 C90,350 200,350 300,390 C380,420 470,380 560,400 C660,420 720,380 800,400 L800,440 L0,440 Z" fill="#324A8A"/>
  <!-- 水面 -->
  <rect x="0" y="430" width="800" height="170" fill="url(#water)"/>
  <!-- 水裡的星星倒影 -->
  <g opacity="0.85">
    <use href="#star" x="120" y="480" width="18" height="18"/>
    <use href="#star" x="230" y="520" width="14" height="14"/>
    <use href="#star" x="330" y="470" width="20" height="20"/>
    <use href="#star" x="430" y="540" width="12" height="12"/>
    <use href="#star" x="560" y="500" width="22" height="22"/>
    <use href="#star" x="680" y="530" width="16" height="16"/>
    <use href="#star" x="760" y="470" width="14" height="14"/>
  </g>
  <ellipse cx="640" cy="470" rx="70" ry="10" fill="#FFF0B3" opacity="0.35"/>
  <path d="M60,500 q40,-8 80,0 t80,0 t80,0" stroke="#7E92D6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M420,560 q40,-8 80,0 t80,0 t80,0" stroke="#7E92D6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 岸邊草地 -->
  <path d="M0,600 L0,455 C80,430 160,440 240,450 C300,458 330,470 360,500 C380,520 380,560 360,600 Z" fill="#3E6B45"/>
  <path d="M0,600 L0,480 C70,462 140,468 210,480 C270,490 300,510 320,540 C330,560 328,585 320,600 Z" fill="#4F8556"/>
  <!-- 小貓（橘貓，坐姿背影微側） -->
  <g transform="translate(150,455)">
    <ellipse cx="60" cy="118" rx="44" ry="12" fill="#1B2A5C" opacity="0.3"/>
    <path d="M40,110 C20,110 10,95 12,75 C14,55 40,40 60,44 C85,48 100,68 96,90 C93,108 78,116 60,116 Z" fill="#F4A259"/>
    <path d="M96,96 C112,92 122,80 118,66 C116,60 108,60 106,66 C104,76 100,86 92,92 Z" fill="#F4A259"/>
    <path d="M22,70 C26,58 34,54 40,56 C44,66 40,78 30,82 Z" fill="#F4A259"/>
    <circle cx="66" cy="34" r="30" fill="#F4A259"/>
    <path d="M42,14 L36,-14 L60,6 Z" fill="#F4A259"/>
    <path d="M90,14 L96,-14 L72,6 Z" fill="#F4A259"/>
    <path d="M45,10 L42,-6 L56,6 Z" fill="#FFD3B6"/>
    <path d="M87,10 L90,-6 L76,6 Z" fill="#FFD3B6"/>
    <path d="M52,24 C56,20 62,20 64,24" stroke="#7A4504" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M72,24 C76,20 82,20 84,24" stroke="#7A4504" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M65,34 l4,4 l-4,3 l-4,-3 Z" fill="#E9538A"/>
    <path d="M64,42 C62,46 60,48 56,48 M66,42 C68,46 70,48 74,48" stroke="#7A4504" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30,36 L48,40 M30,44 L48,44 M92,36 L104,32 M92,44 L104,46" stroke="#F7D9BF" stroke-width="2" stroke-linecap="round"/>
    <path d="M48,60 C52,74 54,90 52,110" stroke="#E08A3C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M70,60 C74,74 76,90 74,110" stroke="#E08A3C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
